<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a1c36" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="grid-line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulse-node {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 12px #38bdf8); }
      }
      @keyframes flow-data {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float-pill-1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes float-pill-2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes grid-drift {
        0% { opacity: 0.15; }
        50% { opacity: 0.35; }
        100% { opacity: 0.15; }
      }
      .anim-pill1 { animation: float-pill-1 6s ease-in-out infinite; }
      .anim-pill2 { animation: float-pill-2 7s ease-in-out infinite; }
      .anim-pulse { animation: pulse-node 4s ease-in-out infinite; transform-origin: center; }
      .anim-flow { stroke-dasharray: 10, 10; animation: flow-data 8s linear infinite; }
      .anim-grid { animation: grid-drift 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Background Tech Grid (Right & Background) -->
  <g class="anim-grid" stroke="url(#grid-line-grad)" stroke-width="1" fill="none">
    <path d="M 600,0 L 600,320 M 660,0 L 660,320 M 720,0 L 720,320 M 780,0 L 780,320 M 840,0 L 840,320 M 900,0 L 900,320 M 960,0 L 960,320" />
    <path d="M 540,40 L 1000,40 M 540,90 L 1000,90 M 540,140 L 1000,140 M 540,190 L 1000,190 M 540,240 L 1000,240 M 540,290 L 1000,290" />
  </g>

  <!-- Relational Graph Connections (Dynamic animated strokes) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <path class="anim-flow" d="M 750,110 C 820,110 820,190 890,190" />
    <path class="anim-flow" d="M 750,110 C 780,110 780,60 840,60" />
    <path class="anim-flow" d="M 840,240 C 870,240 870,190 890,190" />
  </g>

  <!-- Visual Relational Schema Cards in background right -->
  <!-- Table Node 1 -->
  <g transform="translate(680, 75)" opacity="0.85">
    <rect width="130" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="130" height="22" rx="8" fill="#0f172a" />
    <text x="12" y="15" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="10">TABLE: records</text>
    <circle cx="115" cy="11" r="3" fill="#22c55e" />
    <text x="12" y="38" fill="#94a3b8" font-family="monospace" font-size="9">id [UUID]</text>
    <text x="12" y="52" fill="#94a3b8" font-family="monospace" font-size="9">relation_id ➔</text>
  </g>

  <!-- Table Node 2 -->
  <g transform="translate(850, 155)" opacity="0.85">
    <rect width="125" height="70" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <rect width="125" height="22" rx="8" fill="#0f172a" />
    <text x="12" y="15" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="700" font-size="10">TABLE: linked_db</text>
    <circle cx="110" cy="11" r="3" fill="#38bdf8" />
    <text x="12" y="38" fill="#94a3b8" font-family="monospace" font-size="9">primary_key</text>
    <text x="12" y="52" fill="#94a3b8" font-family="monospace" font-size="9">formula_py = f()</text>
  </g>

  <!-- Connecting Node Pulses -->
  <circle cx="750" cy="110" r="5" fill="#38bdf8" class="anim-pulse" filter="url(#subtle-glow)" />
  <circle cx="890" cy="190" r="5" fill="#c084fc" class="anim-pulse" filter="url(#subtle-glow)" />

  <!-- Dynamic Feature Badges / Floating Pills (Top & Bottom right) -->
  <g class="anim-pill1" transform="translate(680, 255)">
    <rect width="135" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <text x="67" y="18" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="10.5" text-anchor="middle">⚡ Python Formulas</text>
  </g>

  <g class="anim-pill2" transform="translate(830, 255)">
    <rect width="140" height="28" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
    <text x="70" y="18" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="10.5" text-anchor="middle">🗄️ SQLite &amp; Postgres</text>
  </g>

  <g class="anim-pill1" transform="translate(770, 20)">
    <rect width="140" height="28" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.2" opacity="0.9" />
    <text x="70" y="18" fill="#e2e8f0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-weight="600" font-size="10.5" text-anchor="middle">🔓 Self-Hosted First</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle (Guaranteed in foreground, never obscured) -->
  <g transform="translate(55, 0)">
    <!-- Category Tag / Top Badge -->
    <g transform="translate(0, 48)">
      <rect width="270" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17" fill="#c7d2fe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">CURATED AWESOME DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" filter="url(#subtle-glow)">
      Awesome Relational
    </text>
    <text x="0" y="168" fill="url(#primary-grad)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5">
      Spreadsheet Platform
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="210" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="400" font-size="14.5">
      Database-Backed Grids, Python Formulas &amp; Self-Hosted Data Sovereignty
    </text>
    <text x="0" y="234" fill="#64748b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="400" font-size="13">
      Airtable Alternatives • No-Code Relational Engines • SQL &amp; SQLite Native Tools
    </text>

    <!-- Stat Badges row under title -->
    <g transform="translate(0, 260)">
      <rect width="105" height="24" rx="6" fill="#1e293b" />
      <text x="52" y="16" fill="#38bdf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">📊 SaaS Leaders</text>

      <rect x="115" width="115" height="24" rx="6" fill="#1e293b" />
      <text x="172" y="16" fill="#818cf8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">⭐ Open-Source</text>

      <rect x="240" width="125" height="24" rx="6" fill="#1e293b" />
      <text x="302" y="16" fill="#34d399" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11" font-weight="600" text-anchor="middle">🛡️ Data Sovereign</text>
    </g>
  </g>

  <!-- Accent Bottom Border Line -->
  <rect x="0" y="316" width="1000" height="4" fill="url(#primary-grad)" />
</svg>
